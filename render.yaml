services:
  - type: web
    name: kindred-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL        # connection string của Neon
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL        # URL của kindred-web, ví dụ https://kindred-web.onrender.com
        sync: false

  - type: web
    name: kindred-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL        # https://kindred-api.onrender.com
        sync: false
      - key: VITE_WS_URL         # wss://kindred-api.onrender.com
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
